# Builds the Clack Arena for Windows installer on a Windows machine and keeps it as a download on the run's page
# (Actions -> this workflow -> the run -> Artifacts). Runs when the game or the desktop app changes, or by hand.
name: Clack Arena for Windows

on:
  push:
    paths:
      - 'desktop/clack-arena/**'
      - 'docs/games/clack-arena/**'
      - '.github/workflows/clack-arena-windows.yml'
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/clack-arena
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/clack-arena/package-lock.json
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Clack-Arena-Setup
          path: desktop/clack-arena/dist/Clack-Arena-Setup-*.exe
          retention-days: 30
          compression-level: 0
