<!doctype html>
<!-- Clack Attack's cover (docs/tools/clack-attack/cover.jpg, 1440x900): the plain screenshot clack-attack-base.jpg with the
     OBS overlay sticker on top. Render with headless Edge at --window-size=1440,900 (the flags in tools/build_banners.ps1),
     then shrink the result to 640x400 for thumb.jpg. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; background: #000; }
  body { position: relative; background: url(clack-attack-base.jpg) 0 0 / 1440px 900px no-repeat; }
  .sticker {
    position: absolute; left: 1078px; top: 650px;
    transform: rotate(-6deg); filter: drop-shadow(7px 8px 0 rgba(0,0,0,.75));
  }
  .edge { padding: 6px; background: #fff; clip-path: polygon(22px 0, 100% 0, 100% calc(100% - 22px), calc(100% - 22px) 100%, 0 100%, 0 22px); }
  .face {
    display: flex; align-items: center; gap: 14px; padding: 14px 20px 14px 14px; white-space: nowrap;
    background: #f5e400; color: #0b0b0d; border: 4px solid #0b0b0d;
    clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
  }
  .face svg { flex: none; width: 72px; height: 72px; }
  .face p { font: 800 31px/0.98 "Saira Condensed", "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: .01em; }
  .face p small { display: block; margin-bottom: 4px; font: 700 15px/1 "Saira Condensed", sans-serif; letter-spacing: .14em; color: #e3122d; }
</style>
</head>
<body>
  <div class="sticker"><div class="edge"><div class="face">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="46" fill="#302e31" stroke="#0b0b0d" stroke-width="5"/>
      <circle cx="50" cy="50" r="40" fill="none" stroke="#fff" stroke-width="3"/>
      <g id="lobe">
        <circle cx="50" cy="27" r="15" fill="#fff"/>
        <circle cx="56" cy="31" r="10" fill="#302e31"/>
      </g>
      <use href="#lobe" transform="rotate(120 50 50)"/>
      <use href="#lobe" transform="rotate(240 50 50)"/>
    </svg>
    <p><small>New</small>Now with OBS<br>overlay plugin!</p>
  </div></div></div>
</body>
</html>
