<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
  <meta name="version" content="v0.1.2-alpha">
<!-- Without this a phone renders the page at a ~980px desktop viewport and
     zooms out, so the game arrives postage-stamp sized. computeLayout() already
     scales the 384x216 canvas from innerWidth and the device pixel ratio, so it
     only ever needed to be told the real width. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANIMALISM</title>
<!-- Chromium app windows paint their title bar with theme-color, which is how
     the windowed title bar matches the game instead of being stock white. -->
<meta name="theme-color" content="#0b0f16">
<meta name="color-scheme" content="dark">
<style>
  /* Pixel font for all UI text. Its glyph outlines are literal squares, so it
     stays blocky at any render size - crisp AND pixelated. */
  @font-face {
    font-family: 'ThaleahFat';
    src: url('assets/fonts/ThaleahFat.ttf') format('truetype');
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0a0e; overflow: hidden;
    font-family: "Courier New", monospace;
  }
  #wrap {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    /* No image-rendering hints: the canvas backing store is sized to exact
       device pixels and sharpness comes from the integer prescale pass. */
    display: block;
    background: #000;
  }
  #boot {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #b8f; letter-spacing: 2px; font-size: 14px;
    background: #0a0a0e; z-index: 10;
  }
  #boot.err { color: #f66; white-space: pre; text-align: left; font-size: 12px; }
</style>
</head>
<body>
  <div id="wrap"><canvas id="screen" width="384" height="216"></canvas></div>
  <div id="boot">LOADING…</div>

  <script src="src/atlas.js?v=0.1.2"></script>
  <script src="src/input.js?v=0.1.2"></script>
  <script src="src/audio.js?v=0.1.2"></script>
  <script src="src/fx.js?v=0.1.2"></script>
  <script src="src/actor.js?v=0.1.2"></script>
  <script src="src/props.js?v=0.1.2"></script>
  <script src="src/player.js?v=0.1.2"></script>
  <script src="src/enemy.js?v=0.1.2"></script>
  <script src="src/stage.js?v=0.1.2"></script>
  <script src="src/levels.js?v=0.1.2"></script>
  <script src="src/game.js?v=0.1.2"></script>

<!-- VRX Games badge: links back to the site. Fixed, small, stays out of the game's way. -->
<style>
.vrx-badge{position:fixed;left:10px;top:10px;z-index:2147483000;display:block;width:88px;opacity:.72;transition:opacity .15s}
.vrx-badge:hover{opacity:1}
.vrx-badge img{display:block;width:100%;height:auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
@media (max-width:640px){.vrx-badge{width:64px;left:6px;top:6px}}
</style>
<a class="vrx-badge" href="../" aria-label="Back to the game page"><picture><source srcset="/assets/brand/vrx-badge.webp" type="image/webp"><img src="/assets/brand/vrx-badge.png" width="180" height="85" alt="VRX Games" decoding="async"></picture></a>
</body>
</html>
