<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="version" content="v0.8.2">
<meta name="theme-color" content="#0b0b0d">
<meta name="color-scheme" content="dark">
<title>Clack Arena</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Saira:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="arena.css">
</head>
<body>
<!-- Clack Arena. The dice shapes, physics library and Green Felt tray come from Clack Attack
     (/tools/clack-attack/play/Table/); the GUI pieces in ui/ are cut from Pixel UI pack 3 by tools/build_arena_ui.py;
     the pixel font is ThaleahFat (also used by Animalism). Everything in js/ is the game. -->
<div id="app">
  <header id="enemy-bar" class="bar"></header>
  <div id="tray-wrap">
    <div id="labels"></div>
    <div id="banner" class="banner"></div>
    <div id="phases" class="phases"></div>
    <div id="thinking" class="thinking"><i class="spin"></i><span></span></div>
    <div id="power" class="power"><i class="bars"></i><b>0%</b></div>
    <div id="say" class="say"></div>
    <div id="hint" class="hint" style="display:none"></div>
    <div id="after" class="after"></div>
    <div id="log" class="log" aria-live="polite"></div>
  </div>
  <footer id="player-bar" class="bar"></footer>
</div>
<div id="overlay" class="overlay"></div>
<nav class="corner-btns">
  <button type="button" class="pbtn small" data-act="rules" title="How to play">?</button>
  <button type="button" class="pbtn small" data-act="settings" title="Settings">Settings</button>
</nav>
<a class="vrx-badge" href="../" aria-label="Back to the game page"><picture><source srcset="/assets/brand/vrx-badge.webp" type="image/webp"><img src="/assets/brand/vrx-badge.png" width="180" height="85" alt="VRX Games" decoding="async"></picture></a>

<script>window.RP = window.RP || {};</script>
<script src="/tools/clack-attack/play/Table/Vendor/Dice_Vendor.js"></script>
<script src="/tools/clack-attack/play/Table/Scripts/Dice_Geometry.js"></script>
<script src="js/data.js"></script>
<script src="js/faces.js"></script>
<script src="js/rules.js"></script>
<script src="js/sfx.js"></script>
<script src="js/ui.js"></script>
<script src="js/tray.js"></script>
<script src="js/game.js"></script>
</body>
</html>
